[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cookies-news-cockpit"
version = "0.1.0"
description = "A private, local-first news cockpit for macOS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Cookies News Cockpit contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
build = [
  "pillow>=11,<13",
  "pyinstaller>=6.12,<7",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]
dev = [
  "pillow>=11,<13",
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
cookies-news-cockpit = "cookies_news_cockpit.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cookies_news_cockpit = [
  "licenses/*",
  "static/*",
  "static/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider --basetemp=test-tmp-local"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
